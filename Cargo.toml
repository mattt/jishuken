[workspace]
resolver = "2"
members = ["ken"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/mattt/ken"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
regex = "1"
rmcp = { version = "1", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt", "io-std", "time"] }
