name: Publish to crates.io

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: macos-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false

      - name: Install Rust
        run: rustup show

      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.event_name == 'release' && 'tag' || github.ref_type }}
        run: |
          test "$RELEASE_REF_TYPE" = tag
          version=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "jishuken") | .version')
          test "$RELEASE_TAG" = "v$version"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          cargo publish -p jishuken --locked --dry-run

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # The initial release is bootstrapped with an API token. This also
      # lets a rerun succeed if an earlier run published before failing.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --user-agent 'jishuken-release (https://github.com/mattt/jishuken)' \
            "https://crates.io/api/v1/crates/jishuken/${RELEASE_TAG#v}")
          case "$status" in
            200) echo "$RELEASE_TAG is already published." ;;
            404) cargo publish -p jishuken --locked ;;
            *) echo "Could not check crates.io (HTTP $status)." >&2; exit 1 ;;
          esac
