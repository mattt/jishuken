[package]
name = "ken"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Jishuken: self-verifying memory for agents, with jujutsu as the storage spine."
authors = ["Mattt Zmuda <mattt@me.com>"]
readme = "../README.md"
homepage = "https://github.com/mattt/ken"
documentation = "https://docs.rs/ken"
keywords = ["agents", "memory", "mcp", "verification", "jujutsu"]
categories = ["command-line-utilities", "development-tools", "caching"]
# The readme above is pulled in from the workspace root by cargo; include
# globs are package-root-relative.
include = ["src/**/*.rs", "LICENSE"]

[lib]
name = "ken"
path = "src/lib.rs"

[[bin]]
name = "ken"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
chrono.workspace = true
blake3.workspace = true
clap.workspace = true
toml.workspace = true
regex.workspace = true
rmcp.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
